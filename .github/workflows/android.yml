name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  diagnose:
    name: Capture analyze & build output
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: analyze
        run: flutter analyze > analyze.txt 2>&1 || true
      - name: build
        run: flutter build apk --release > build.txt 2>&1 || true
      - name: publish logs to ci-logs branch
        run: |
          mkdir -p _cilogs
          cp analyze.txt _cilogs/analyze.txt || true
          tail -220 build.txt > _cilogs/build.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f _cilogs/analyze.txt _cilogs/build.txt
          git commit -m "CI diagnostics logs"
          git push -f origin ci-logs
