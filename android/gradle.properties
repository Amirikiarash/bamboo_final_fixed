org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# tflite_flutter ships Java 1.8 + Kotlin 17 in one module. On Android everything
# is dexed, so the Java/Kotlin JVM-target difference is harmless; downgrade the
# Kotlin validation from a hard error to a warning so the release APK builds.
kotlin.jvm.target.validation.mode=warning
